[package]
name = "sonny-render"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "sonny's native GPU renderer: tiled layers, a GPU brush and compositing on wgpu (Metal, Vulkan, Direct3D 12)"
publish = false

[dependencies]
wgpu = "30"
pollster = "1"
bytemuck = { version = "1", features = ["derive"] }
sysinfo = { version = "0.39", default-features = false, features = ["system"] }

[dev-dependencies]
# Only for examples/window.rs, which checks the display in a real window; the desktop shell brings its own window.
winit = "0.30"

[profile.dev]
debug = 0
