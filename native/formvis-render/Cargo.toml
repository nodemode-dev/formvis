[package]
name = "formvis-render"
version = "0.8.0"
edition = "2021"
license = "Apache-2.0"
description = "formvis's native GPU renderer: tiled layers, a GPU brush and compositing on wgpu (Metal, Vulkan, Direct3D 12)"
publish = false

[dependencies]
wgpu = "=30.0.1"
pollster = "=1.0.1"
bytemuck = { version = "=1.25.2", features = ["derive"] }
sysinfo = { version = "=0.39.6", default-features = false, features = ["system"] }
png = "=0.18.1"
serde_json = "=1.0.151"
winit = { version = "=0.30.13", optional = true }

[features]
window = ["dep:winit"]

[[example]]
name = "window"
required-features = ["window"]

[profile.dev]
debug = 0
