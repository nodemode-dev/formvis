server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # formvis in an iframe: name the embedding site here, or remove the line to allow none.
    add_header Content-Security-Policy "frame-ancestors 'self' https://example.com" always;
    add_header Permissions-Policy "clipboard-read=(self), clipboard-write=(self)" always;

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # The hosted page runs without the engine: the engine answers only this computer's own window and agents.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
