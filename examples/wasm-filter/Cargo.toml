# formvis WebAssembly filter plug-in, ABI v1. The sample: Tint Mix.
#
# Build (once: rustup target add wasm32-unknown-unknown):
#   cargo build --release --target wasm32-unknown-unknown
# The result is target/wasm32-unknown-unknown/release/tint_mix.wasm. In formvis, open Filter > Plug-ins
# (WebAssembly) > Manage, choose Install, and pick that file. The prebuilt copy the Install Example button
# uses is frontend/public/wasm-plugins/tint-mix.wasm; rebuild it with the command above and copy it there.
# ABI v1 is described at the top of src/lib.rs and in docs/WASM_PLUGINS.md.

[package]
name = "tint-mix"
version = "1.0.0"
edition = "2021"
license = "Apache-2.0"
publish = false

[lib]
crate-type = ["cdylib"]

[profile.release]
opt-level = "z"
lto = true
panic = "abort"
codegen-units = 1
strip = true
