name: ci

on:
  push:
    branches: [main, 'compile_v*']
  pull_request:

permissions:
  contents: read

# A pull request's newer push cancels its older run. Runs on main and compile_v* are never cancelled: formcompiler
# releases a commit only when this workflow passed on that exact commit.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=low
      - run: npm test
      - run: npm run build

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
        working-directory: frontend
      - name: Type check the frontend
        run: npx tsc --noEmit -p .
        working-directory: frontend
      - name: Byte-compile the engine, the setup scripts and the browser tests
        run: python -m compileall -q backend/app backend/formvis_engine.py setup e2e
      - name: Workflow files parse
        run: |
          pip install pyyaml
          python -c "import glob, yaml; [yaml.safe_load(open(f, encoding='utf-8')) for f in sorted(glob.glob('.github/workflows/*.yml'))]; print('workflows parse')"
      - name: Release notes script reads the changelog
        run: python setup/release_notes.py "v$(sed -n 's/^## \([0-9][0-9.]*\) .*/\1/p' CHANGELOG.md | head -1)" | head -5

  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - run: python -m compileall -q app formvis_engine.py
      - run: python formvis_engine.py --selfcheck
      - name: Boot the engine and probe it
        run: |
          python -m uvicorn app.main:app --host 127.0.0.1 --port 8190 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8190/api/health && break; sleep 1; done
          curl -sf http://127.0.0.1:8190/api/capabilities

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-test.txt
      - name: Engine and test dependencies
        run: pip install -r backend/requirements.txt -r backend/requirements-test.txt
      - name: Engine tests, family layers included (no network, model tests skip)
        working-directory: backend
        run: python -m pytest -q -rs -p no:cacheprovider tests

  window:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build the window
        working-directory: frontend
        run: |
          npm ci
          npm run build
      - name: Engine, pytest and Playwright
        run: |
          pip install -r backend/requirements.txt pytest==9.1.1 playwright==1.63.0
          python -m playwright install --with-deps chromium
      - name: Window smoke (F7, no network, models stay off)
        run: python -m pytest -q -p no:cacheprovider frontend/tests/window

  scripts:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Shell syntax
        run: |
          for f in formvis formvis_oc_install backend/oc_install backend/boot_backend frontend/oc_install frontend/boot_frontend setup/*; do
            [ -f "$f" ] || continue
            case "$f" in *.bat|*.py) continue ;; esac
            head -n 1 "$f" | grep -q 'sh' || continue
            bash -n "$f"
          done
      - name: No em dash in tracked markdown, no emoji in tracked text
        run: |
          python3 - <<'PY'
          import subprocess, sys
          bad = []
          for path in subprocess.check_output(['git', 'ls-files'], text=True).split():
              try:
                  text = open(path, encoding='utf-8').read()
              except (UnicodeDecodeError, IsADirectoryError, FileNotFoundError):
                  continue
              markdown = path.endswith('.md')
              for ch in text:
                  cp = ord(ch)
                  if (markdown and cp == 0x2014) or 0x1F000 <= cp <= 0x1FAFF or 0x2600 <= cp <= 0x27BF:
                      bad.append(f'{path}: U+{cp:04X}')
                      break
          print('\n'.join(bad) or 'clean')
          sys.exit(1 if bad else 0)
          PY
