name: desktop

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      draft_release:
        description: 'Upload the bundles to a DRAFT release (it stays a draft until the owner publishes it)'
        type: boolean
        default: false
      tag:
        description: 'Release tag for the draft, for example v1.89.6 (the tag is created only when the owner publishes the draft)'
        type: string
        default: ''
      bundle_ml:
        description: 'Freeze rembg and ONNX Runtime into the engine'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos-arm64
            os: macos-latest
            arch: aarch64
          - name: macos-x64
            os: macos-15-intel
            arch: x86_64
            experimental: true
          - name: linux-x64
            os: ubuntu-22.04
            arch: x64
            debarch: amd64
          - name: linux-arm64
            os: ubuntu-22.04-arm
            arch: arm64
            debarch: arm64
            experimental: true
          - name: windows-x64
            os: windows-latest
            arch: x64
          - name: windows-arm64
            os: windows-11-arm
            arch: arm64
            experimental: true
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.experimental == true }}
    env:
      WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
      WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
      FORMVIS_FREEZE_ML: ${{ inputs.bundle_ml && '1' || '0' }}
      MSIX_IDENTITY_NAME: ${{ vars.MSIX_IDENTITY_NAME }}
      MSIX_PUBLISHER: ${{ vars.MSIX_PUBLISHER }}
      MSIX_PUBLISHER_DISPLAY_NAME: ${{ vars.MSIX_PUBLISHER_DISPLAY_NAME }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Linux webview packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libxdo-dev libssl-dev
      - name: Import the Windows signing certificate (only when the WINDOWS_CERTIFICATE secret is set)
        if: runner.os == 'Windows' && env.WINDOWS_CERTIFICATE != ''
        shell: pwsh
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP 'formvis-signing.pfx'
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE))
          $password = ConvertTo-SecureString $env:WINDOWS_CERTIFICATE_PASSWORD -AsPlainText -Force
          $cert = Import-PfxCertificate -FilePath $pfx -CertStoreLocation Cert:\CurrentUser\My -Password $password
          Remove-Item $pfx
          "WINDOWS_CERT_THUMBPRINT=$($cert.Thumbprint)" | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: Install both sides and the desktop toolchain
        shell: bash
        run: |
          ./formvis install --lite
          ./formvis install-desktop
      - name: Build the desktop bundle
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          # Unset empty secrets: an empty APPLE_CERTIFICATE would make Tauri try to import a blank certificate.
          [ -n "$APPLE_CERTIFICATE" ] || unset APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY
          [ -n "$APPLE_ID" ] || unset APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID
          [ -n "$TAURI_SIGNING_PRIVATE_KEY" ] || unset TAURI_SIGNING_PRIVATE_KEY TAURI_SIGNING_PRIVATE_KEY_PASSWORD
          # One merged config: updater artifacts only with the updater key, the Windows thumbprint only when imported.
          cfg="$(WINDOWS_CERT_THUMBPRINT="${WINDOWS_CERT_THUMBPRINT:-}" python - <<'PY'
          import json, os
          bundle = {}
          if os.environ.get('TAURI_SIGNING_PRIVATE_KEY'):
              bundle['createUpdaterArtifacts'] = True
          if os.environ.get('WINDOWS_CERT_THUMBPRINT'):
              bundle['windows'] = {'certificateThumbprint': os.environ['WINDOWS_CERT_THUMBPRINT']}
          print(json.dumps({'bundle': bundle}) if bundle else '')
          PY
          )"
          if [ -n "$cfg" ]; then ./formvis desktop build --config "$cfg"; else ./formvis desktop build; fi
      - name: Name the macOS update archive by architecture
        if: runner.os == 'macOS'
        shell: bash
        run: |
          cd src-tauri/target/release/bundle/macos
          for f in formvis.app.tar.gz formvis.app.tar.gz.sig; do [ -f "$f" ] && mv "$f" "${f/formvis/formvis_${{ matrix.arch }}}"; done
          true
      - name: Portable Windows zip
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $out = "portable/formvis"
          New-Item -ItemType Directory -Force $out | Out-Null
          Copy-Item src-tauri/target/release/formvis.exe $out
          Copy-Item src-tauri/target/release/formvis-engine.exe $out
          Set-Content -Path "$out/portable.txt" -Value "formvis keeps its data in the FormvisData folder beside this file."
          Compress-Archive -Path "portable/formvis" -DestinationPath "portable/formvis-portable-windows-${{ matrix.arch }}.zip"
      - name: Microsoft Store package (only when the MSIX_IDENTITY_NAME and MSIX_PUBLISHER variables are set)
        if: runner.os == 'Windows' && env.MSIX_IDENTITY_NAME != '' && env.MSIX_PUBLISHER != ''
        shell: pwsh
        run: |
          $conf = Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json
          $version = ($conf.version -replace '[-+].*$', '') + '.0'
          $arch = if ('${{ matrix.arch }}' -eq 'arm64') { 'arm64' } else { 'x64' }
          $root = 'msix/layout'
          New-Item -ItemType Directory -Force "$root/Assets" | Out-Null
          Copy-Item src-tauri/target/release/formvis.exe, src-tauri/target/release/formvis-engine.exe $root
          $py = 'backend\venv\Scripts\python.exe'
          & $py -c "from PIL import Image; im = Image.open('src-tauri/icons/icon.png').convert('RGBA'); [im.resize((s, s), Image.LANCZOS).save('$root/Assets/' + n + '.png') for n, s in (('Square44x44Logo', 44), ('Square150x150Logo', 150), ('StoreLogo', 50))]"
          $manifest = Get-Content packaging/msix/AppxManifest.xml -Raw
          $manifest = $manifest.Replace('@MSIX_IDENTITY_NAME@', $env:MSIX_IDENTITY_NAME).Replace('@MSIX_PUBLISHER@', $env:MSIX_PUBLISHER).Replace('@MSIX_PUBLISHER_DISPLAY_NAME@', $env:MSIX_PUBLISHER_DISPLAY_NAME).Replace('@MSIX_VERSION@', $version).Replace('@MSIX_ARCH@', $arch)
          Set-Content -Path "$root/AppxManifest.xml" -Value $manifest -Encoding utf8
          $tool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\makeappx.exe" | Sort-Object FullName | Select-Object -Last 1
          & $tool.FullName pack /d $root /p "msix/formvis_${version}_$arch.msix" /o
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Linux tar.gz
        if: runner.os == 'Linux'
        run: tar -czf formvis-linux-${{ matrix.arch }}.tar.gz -C src-tauri/target/release/bundle/deb/formvis_*_${{ matrix.debarch }}/data usr
      - uses: actions/upload-artifact@v4
        with:
          name: formvis-${{ matrix.name }}
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/rpm/*.rpm
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/macos/*.app.tar.gz
            portable/formvis-portable-windows-*.zip
            msix/*.msix
            formvis-linux-*.tar.gz
            src-tauri/target/release/bundle/**/*.sig

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.draft_release && inputs.tag != '')
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: bundles
          merge-multiple: true
      - name: Updater feed (latest.json)
        shell: bash
        run: |
          python3 - <<'PY'
          import datetime, glob, json, os
          tag = os.environ['RELEASE_TAG']
          base = f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/releases/download/{tag}/"
          targets = {'darwin-aarch64': '*_aarch64.app.tar.gz', 'darwin-x86_64': '*_x86_64.app.tar.gz', 'linux-x86_64': '*amd64.AppImage',
                     'linux-aarch64': '*aarch64.AppImage', 'windows-x86_64': '*x64-setup.exe', 'windows-aarch64': '*arm64-setup.exe'}
          platforms = {}
          for key, pattern in targets.items():
              for f in sorted(glob.glob('bundles/**/' + pattern, recursive=True)):
                  if os.path.exists(f + '.sig'):
                      platforms[key] = {'signature': open(f + '.sig').read().strip(), 'url': base + os.path.basename(f)}
                      break
          if platforms:
              feed = {'version': tag.lstrip('v'), 'notes': f'formvis {tag}', 'platforms': platforms,
                      'pub_date': datetime.datetime.now(datetime.timezone.utc).strftime('%Y-%m-%dT%H:%M:%SZ')}
              json.dump(feed, open('bundles/latest.json', 'w'), indent=2)
              print('latest.json written for', ', '.join(platforms))
          else:
              print('no updater signatures (TAURI_SIGNING_PRIVATE_KEY unset); latest.json not written')
          PY
      - name: Release notes from the CHANGELOG
        shell: bash
        run: |
          python3 - <<'PY'
          import os, re
          tag = os.environ['RELEASE_TAG'].lstrip('v')
          text = open('CHANGELOG.md', encoding='utf-8').read()
          m = re.search(r'^## ' + re.escape(tag) + r'\b.*?(?=^## |\Z)', text, re.S | re.M)
          open('release-notes.md', 'w', encoding='utf-8').write(m.group(0).strip() if m else f'formvis {tag}')
          PY
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          tag_name: ${{ env.RELEASE_TAG }}
          target_commitish: ${{ github.sha }}
          body_path: release-notes.md
          files: bundles/**/*
