name: desktop

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos-arm64
            os: macos-latest
          - name: linux-x64
            os: ubuntu-22.04
          - name: windows-x64
            os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Linux webview packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - name: Install both sides and the desktop toolchain
        shell: bash
        run: |
          ./formvis install --lite
          ./formvis install-desktop
      - name: Build the desktop bundle
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          # Unset empty secrets: an empty APPLE_CERTIFICATE would make Tauri try to import a blank certificate.
          [ -n "$APPLE_CERTIFICATE" ] || unset APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY
          [ -n "$APPLE_ID" ] || unset APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID
          if [ -n "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            ./formvis desktop build --config '{"bundle":{"createUpdaterArtifacts":true}}'
          else
            unset TAURI_SIGNING_PRIVATE_KEY TAURI_SIGNING_PRIVATE_KEY_PASSWORD
            ./formvis desktop build
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: formvis-${{ matrix.name }}
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/rpm/*.rpm
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/macos/*.app.tar.gz
            src-tauri/target/release/bundle/**/*.sig

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: bundles
          merge-multiple: true
      - name: Updater feed (latest.json)
        shell: bash
        run: |
          python3 - <<'PY'
          import datetime, glob, json, os
          tag = os.environ['GITHUB_REF_NAME']
          base = f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/releases/download/{tag}/"
          targets = {'darwin-aarch64': '*.app.tar.gz', 'linux-x86_64': '*.AppImage', 'windows-x86_64': '*-setup.exe'}
          platforms = {}
          for key, pattern in targets.items():
              for f in sorted(glob.glob('bundles/**/' + pattern, recursive=True)):
                  if os.path.exists(f + '.sig'):
                      platforms[key] = {'signature': open(f + '.sig').read().strip(), 'url': base + os.path.basename(f)}
                      break
          if platforms:
              feed = {'version': tag.lstrip('v'), 'notes': f'formvis {tag}', 'platforms': platforms,
                      'pub_date': datetime.datetime.now(datetime.timezone.utc).strftime('%Y-%m-%dT%H:%M:%SZ')}
              json.dump(feed, open('bundles/latest.json', 'w'), indent=2)
              print('latest.json written for', ', '.join(platforms))
          else:
              print('no updater signatures (TAURI_SIGNING_PRIVATE_KEY unset); latest.json not written')
          PY
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: bundles/**/*
