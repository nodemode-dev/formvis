[package]
name = "formvis"
version = "1.87.0"
description = "formvis desktop shell"
authors = ["nodemode-ai"]
license = "Apache-2.0"
edition = "2021"
rust-version = "1.77.2"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# devtools (1.86.4): the Web Inspector in release builds too (right-click > Inspect Element), so a slow desktop window
# can be profiled where it runs (Timelines) and `formvisPerf.record(10)` run in its console. Tauri notes it uses
# private macOS API, which matters only for the Mac App Store.
tauri = { version = "2", features = ["devtools"] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
regex = "1"
# tauri::generate_context! expands to code that uses serde_json, so the app crate must depend on it (Tauri's own
# template does); without it the shell did not compile, which the first cargo check, in 1.43.0, found.
serde_json = "1"
# The installed font families for the Type tool (the desktop web views have no Local Font Access API): pure Rust, MIT.
fontdb = "0.24"
# The native GPU renderer (Phase 20), started only when the app asks for it (native_start).
formvis-render = { path = "../native/formvis-render" }
serde = { version = "1", features = ["derive"] }

# The monitor's ICC profile (display.rs): the X11 root window's _ICC_PROFILE on Linux, through libX11 opened at run time (MIT; already in the tree through tao).
[target.'cfg(target_os = "linux")'.dependencies]
x11-dl = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
# Not stripped (1.85.3): on the owner's Mac (rustc 1.97.1) the release profile's strip also reached the derive crates
# Cargo builds for the compiler itself, and a stripped derive library loses the data rustc reads it by, so the next
# crate failed with E0463 "can't find crate for zerofrom_derive" although the file was there. Release builds carry no
# debug information either way; the app is a few megabytes larger with its symbols kept.
strip = false

# The derive crates and build scripts run inside the compiler: never stripped, whatever the release profile says.
[profile.release.build-override]
strip = false
