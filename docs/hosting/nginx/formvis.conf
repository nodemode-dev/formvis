server {
    listen 80;
    server_name example.test;
    root /var/www/formvis;
    index index.html;

    types { application/wasm wasm; }

    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Embedder-Policy "credentialless" always;

    location /assets/ {
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Embedder-Policy "credentialless" always;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location ~ ^/assets/plugin-worker-.*\.js$ {
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Embedder-Policy "credentialless" always;
        add_header Content-Security-Policy "default-src 'none'; script-src blob:; connect-src 'none'; worker-src 'none'; frame-src 'none'; img-src 'none'; style-src 'none'" always;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }
}
